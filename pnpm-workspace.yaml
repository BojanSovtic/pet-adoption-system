packages:
  - 'apps/*'
  - 'packages/shared/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # Ships prebuilt binaries; the install script only compiles when none match.
  argon2: false
  esbuild: true
  # Tests download the MongoDB binary on first use instead of at install time.
  mongodb-memory-server: false
  nx: true
  unrs-resolver: true
